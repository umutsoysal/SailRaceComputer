name: Feature request
description: Propose an enhancement to Race Mate
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Clear user value and acceptance criteria help us prioritize quickly.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem are you trying to solve?
      placeholder: As a sailor, I want ... so that ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your ideal behavior or UI.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete criteria for done.
      placeholder: |
        - [ ] ...
        - [ ] ...
