name: Bug report
description: Report a reproducible problem in Race Mate
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Race Mate. Please include enough detail to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps help us debug quickly.
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0+1

  - type: input
    id: flutter_version
    attributes:
      label: Flutter version
      placeholder: output of flutter --version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste console errors, stack traces, or screenshots.
      render: shell
