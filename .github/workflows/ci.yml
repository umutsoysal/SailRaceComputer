name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage floor
        run: dart tool/check_coverage.dart

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint is run directly rather than through the reviewdog wrapper:
      # the wrapper's github-check reporter needs `checks: write` (which forked
      # pull requests cannot be granted) and its local reporter needs a diff
      # command it has no way to get on a push. Running the binary needs
      # neither, and pinning the version plus its published checksum keeps the
      # download honest. The runner image already provides shellcheck, which
      # actionlint picks up to lint `run:` blocks.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build production web bundle
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" $(dart tool/version.dart build-args web)

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      # No standalone `./gradlew` step here: Flutter's android/.gitignore
      # excludes the wrapper scripts, so they do not exist in a fresh clone.
      # An incompatible Gradle/AGP/Kotlin combination is caught much earlier by
      # test/toolchain_test.dart in the fast job.
      - name: Build release APK
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release $(dart tool/version.dart build-args android)

      - name: Build release Android App Bundle
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build appbundle --release $(dart tool/version.dart build-args android)

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    timeout-minutes: 40
    # macOS minutes bill at 10x, so keep this off the per-push PR path: it runs
    # on main, on demand, and on PRs explicitly labelled `ios`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ios')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: ios

      - name: Build unsigned iOS release bundle
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build ios --release --no-codesign $(dart tool/version.dart build-args ios)
