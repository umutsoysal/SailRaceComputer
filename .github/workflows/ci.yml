name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage floor
        run: dart tool/check_coverage.dart

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          reporter: github-check
          fail_level: error

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build production web bundle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" $(dart tool/version.dart build-args web)

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      - name: Build release APK
        run: flutter build apk --release $(dart tool/version.dart build-args android)

      - name: Build release Android App Bundle
        run: flutter build appbundle --release $(dart tool/version.dart build-args android)

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    timeout-minutes: 40
    # macOS minutes bill at 10x, so keep this off the per-push PR path: it runs
    # on main, on demand, and on PRs explicitly labelled `ios`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ios')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: ios

      - name: Build unsigned iOS release bundle
        run: flutter build ios --release --no-codesign $(dart tool/version.dart build-args ios)
