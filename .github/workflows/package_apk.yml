name: Package APK

# Produces install-ready Android APKs on demand, without cutting a release tag.
#
# Run it from the Actions tab. Every run uploads the APKs as workflow artifacts;
# tick "publish" to also attach them to the rolling `latest-build` prerelease,
# which gives testers a stable download URL that always points at the newest
# build.
#
# Tagged releases are handled separately by release.yml.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also attach the APKs to the rolling "latest-build" prerelease'
        type: boolean
        default: false
      universal:
        description: "Also build the universal APK (~50MB, runs on any device)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used when `publish` is ticked
    env:
      # The `secrets` context is unavailable to step-level `if:`, so resolve the
      # "is signing configured?" question once, here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Decode Android keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Write Android signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # One APK per ABI. A device only needs the one matching its CPU, which
      # cuts the download from ~50MB to ~17-20MB.
      - name: Build per-ABI APKs
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release --split-per-abi $(dart tool/version.dart build-args android)

      - name: Build universal APK
        if: inputs.universal
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release $(dart tool/version.dart build-args android)

      - name: Name and collect the APKs
        id: collect
        run: |
          mkdir -p apks
          version="$(dart tool/version.dart value marketing)"
          build="$(dart tool/version.dart value android-build)"
          short_sha="${GITHUB_SHA::7}"
          stem="race-mate-${version}-b${build}-${short_sha}"
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Surfaced in the release notes so nobody installs a debug-signed
          # build without knowing.
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "signing=Signed with the upload keystore." >> "$GITHUB_OUTPUT"
          else
            echo "signing=**Debug-signed** — for testing only. Android may warn on install, and this build cannot update a Play Store install." >> "$GITHUB_OUTPUT"
          fi

          out=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "${out}/app-${abi}-release.apk" ] || continue
            cp "${out}/app-${abi}-release.apk" "apks/${stem}-${abi}.apk"
          done
          if [ -f "${out}/app-release.apk" ]; then
            cp "${out}/app-release.apk" "apks/${stem}-universal.apk"
          fi

          cd apks
          sha256sum -- *.apk > SHA256SUMS.txt
          ls -1

      - name: Summarise the build
        env:
          STEM: ${{ steps.collect.outputs.stem }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          {
            echo "## Race Mate ${VERSION} — installable APKs"
            echo
            if [ "${HAS_KEYSTORE}" = "true" ]; then
              echo "🔏 Signed with the upload keystore."
            else
              echo "⚠️ **Debug-signed** — \`ANDROID_KEYSTORE_BASE64\` is not configured."
              echo "Fine for testing; it cannot be used to update a Play Store install."
            fi
            echo
            echo "| File | Size | Install on |"
            echo "| --- | --- | --- |"
            for f in apks/*.apk; do
              size="$(du -h "$f" | cut -f1)"
              case "$f" in
                *arm64-v8a*)   target="Nearly every phone from ~2017 onward — **start here**";;
                *armeabi-v7a*) target="Older 32-bit ARM devices";;
                *x86_64*)      target="Emulators and x86 Chromebooks";;
                *universal*)   target="Anything, at ~3x the download";;
                *)             target="—";;
              esac
              echo "| \`$(basename "$f")\` | ${size} | ${target} |"
            done
            echo
            echo "Download from the **Artifacts** section of this run, then allow"
            echo "installation from your browser or file manager when Android asks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.collect.outputs.stem }}-apks
          path: apks/*
          if-no-files-found: error
          retention-days: 30

      # Opt-in. Keeps one moving `latest-build` prerelease so testers can always
      # grab the newest APK from the same URL, without it looking like a real
      # release.
      - name: Publish to the rolling latest-build prerelease
        if: inputs.publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-build
          name: Latest development build
          prerelease: true
          body: |
            Race Mate ${{ steps.collect.outputs.version }} — automated build of
            `${{ github.sha }}` from `${{ github.ref_name }}`.

            ### Which file do I want?

            | File | Size | Install on |
            | --- | --- | --- |
            | `${{ steps.collect.outputs.stem }}-arm64-v8a.apk` | ~18MB | Nearly every phone from ~2017 onward — **start here** |
            | `${{ steps.collect.outputs.stem }}-armeabi-v7a.apk` | ~16MB | Older 32-bit ARM devices |
            | `${{ steps.collect.outputs.stem }}-x86_64.apk` | ~20MB | Emulators and x86 Chromebooks |
            | `${{ steps.collect.outputs.stem }}-universal.apk` | ~50MB | Anything, at ~3x the download |

            Open the file on your phone and allow installation when Android
            asks. `SHA256SUMS.txt` lists checksums for everything here.

            ${{ steps.collect.outputs.signing }}

            > This tag moves with every published build, so it is marked as a
            > pre-release. For a fixed version, use a tagged release.
          files: apks/*
