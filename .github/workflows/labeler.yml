name: Labeler

# Applies the path-based labels defined in .github/labeler.yml so PRs are
# triageable at a glance — and so the iOS build job knows when to run.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
