name: Labeler

# Applies the path-based labels defined in .github/labeler.yml so PRs are
# triageable at a glance — and so the iOS build job knows when to run.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
