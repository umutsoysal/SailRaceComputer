name: Package AAB

# Produces a signed Android App Bundle (.aab) for Play Console upload on demand.
#
# Run it from the Actions tab. Play Console rejects debug-signed bundles, so
# this workflow requires ANDROID_KEYSTORE_BASE64 to be configured — it refuses
# to produce an unsigned artifact that would be silently rejected downstream.
#
# Tagged releases are handled separately by release.yml.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also attach the AAB to the rolling "latest-build" prerelease'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used when `publish` is ticked
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Decode Android keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Write Android signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build Android App Bundle
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          if [ "${HAS_KEYSTORE}" != "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Play Console rejects a debug-signed bundle, so this workflow refuses to produce one. Configure the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets — see docs/release.md."
            exit 1
          fi
          # shellcheck disable=SC2046
          flutter build appbundle --release $(dart tool/version.dart build-args android)

      - name: Name and collect the AAB
        id: collect
        run: |
          mkdir -p aab
          version="$(dart tool/version.dart value marketing)"
          build="$(dart tool/version.dart value android-build)"
          short_sha="${GITHUB_SHA::7}"
          stem="race-mate-${version}-b${build}-${short_sha}"
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/bundle/release/app-release.aab "aab/${stem}.aab"
          cd aab
          sha256sum -- *.aab > SHA256SUMS.txt
          ls -1

      - name: Summarise the build
        env:
          STEM: ${{ steps.collect.outputs.stem }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          {
            echo "## Race Mate ${VERSION} — Android App Bundle"
            echo
            echo "🔏 Signed with the upload keystore."
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in aab/*.aab; do
              size="$(du -h "$f" | cut -f1)"
              echo "| \`$(basename "$f")\` | ${size} |"
            done
            echo
            echo "Upload the \`.aab\` to Play Console."
            echo "The \`SHA256SUMS.txt\` file lists the checksum for verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.collect.outputs.stem }}-aab
          path: aab/*
          if-no-files-found: error
          retention-days: 30

      # Opt-in. Attaches the AAB to the same rolling `latest-build` prerelease
      # used by the APK workflow so everything is accessible from one URL.
      - name: Publish to the rolling latest-build prerelease
        if: inputs.publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-build
          name: Latest development build
          prerelease: true
          body: |
            Race Mate ${{ steps.collect.outputs.version }} — automated build of
            `${{ github.sha }}` from `${{ github.ref_name }}`.

            🔏 Signed with the upload keystore.

            Upload `${{ steps.collect.outputs.stem }}.aab` to Play Console.

            > This tag moves with every published build, so it is marked as a
            > pre-release. For a fixed version, use a tagged release.
          files: aab/*
