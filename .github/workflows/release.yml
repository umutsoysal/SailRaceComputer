name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-android-web:
    name: Package Android & Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The `secrets` context is not available to step-level `if:`, so fold the
      # "is signing configured?" question into a job-level env var instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Decode Android keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Write Android signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Report signing mode
        run: |
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "🔏 Android artifacts will be signed with the upload keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 is not set — Android artifacts are **unsigned**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android and Web artifacts
        run: |
          flutter build apk --release $(dart tool/version.dart build-args android)
          flutter build appbundle --release $(dart tool/version.dart build-args android)
          flutter build web --release --base-href "/" $(dart tool/version.dart build-args web)

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          ANDROID_BUILD="$(dart tool/version.dart value android-build)"
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/race-mate-${GITHUB_REF_NAME}-android-b${ANDROID_BUILD}.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/race-mate-${GITHUB_REF_NAME}-android-b${ANDROID_BUILD}.aab
          tar -czf release-assets/race-mate-web-${GITHUB_REF_NAME}.tar.gz -C build/web .

      - name: Upload packaged Android and Web assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-android-web
          path: release-assets/*
          if-no-files-found: error

  package-ios:
    name: Package iOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: ios

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Build unsigned iOS release bundle
        run: flutter build ios --release --no-codesign $(dart tool/version.dart build-args ios)

      - name: Archive iOS app bundle
        run: |
          mkdir -p release-assets
          IOS_BUILD="$(dart tool/version.dart value ios-build)"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/race-mate-ios-${GITHUB_REF_NAME}-ios-b${IOS_BUILD}-unsigned.zip

      - name: Upload packaged iOS asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package-android-web
      - package-ios
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
