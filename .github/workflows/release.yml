name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-android-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Decode Android keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Write Android signing properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android and Web artifacts
        run: |
          flutter build apk --release $(dart tool/version.dart build-args android)
          flutter build appbundle --release $(dart tool/version.dart build-args android)
          flutter build web --release --base-href "/" $(dart tool/version.dart build-args web)

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          ANDROID_BUILD="$(dart tool/version.dart value android-build)"
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/race-mate-${GITHUB_REF_NAME}-android-b${ANDROID_BUILD}.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/race-mate-${GITHUB_REF_NAME}-android-b${ANDROID_BUILD}.aab
          tar -czf release-assets/race-mate-web-${GITHUB_REF_NAME}.tar.gz -C build/web .

      - name: Upload packaged Android and Web assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android-web
          path: release-assets/*
          if-no-files-found: error

  package-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Build unsigned iOS release bundle
        run: flutter build ios --release --no-codesign $(dart tool/version.dart build-args ios)

      - name: Archive iOS app bundle
        run: |
          mkdir -p release-assets
          IOS_BUILD="$(dart tool/version.dart value ios-build)"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/race-mate-ios-${GITHUB_REF_NAME}-ios-b${IOS_BUILD}-unsigned.zip

      - name: Upload packaged iOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - package-android-web
      - package-ios
    timeout-minutes: 15

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
