name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-android-web:
    name: Package Android & Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The `secrets` context is not available to step-level `if:`, so fold the
      # "is signing configured?" question into a job-level env var instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: android

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Decode Android keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Write Android signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Report signing mode
        run: |
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "🔏 Android artifacts will be signed with the upload keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 is not set — Android artifacts are **unsigned**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android and Web artifacts
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release --split-per-abi $(dart tool/version.dart build-args android)
          # shellcheck disable=SC2046
          flutter build apk --release $(dart tool/version.dart build-args android)
          # shellcheck disable=SC2046
          flutter build appbundle --release $(dart tool/version.dart build-args android)
          # shellcheck disable=SC2046
          flutter build web --release --base-href "/" $(dart tool/version.dart build-args web)

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          ANDROID_BUILD="$(dart tool/version.dart value android-build)"
          BASE="race-mate-${GITHUB_REF_NAME}-android-b${ANDROID_BUILD}"
          OUT=build/app/outputs/flutter-apk
          # Per-ABI APKs are ~17-20MB against ~50MB for the universal one, so
          # ship both and let people pick.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "${OUT}/app-${abi}-release.apk" ] || continue
            cp "${OUT}/app-${abi}-release.apk" "release-assets/${BASE}-${abi}.apk"
          done
          cp "${OUT}/app-release.apk" "release-assets/${BASE}-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/${BASE}.aab"
          tar -czf "release-assets/race-mate-web-${GITHUB_REF_NAME}.tar.gz" -C build/web .

      - name: Upload packaged Android and Web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-android-web
          path: release-assets/*
          if-no-files-found: error

  package-ios:
    name: Package iOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-key-suffix: ios

      - name: Validate version metadata
        run: dart tool/version.dart check

      - name: Verify release version
        run: dart tool/verify_release_version.dart "${GITHUB_REF_NAME}"

      - name: Build unsigned iOS release bundle
        # Word splitting of the build-args output is intentional: it emits
        # multiple separate flags.
        run: |
          # shellcheck disable=SC2046
          flutter build ios --release --no-codesign $(dart tool/version.dart build-args ios)

      - name: Archive iOS app bundle
        run: |
          mkdir -p release-assets
          IOS_BUILD="$(dart tool/version.dart value ios-build)"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app \
            "release-assets/race-mate-ios-${GITHUB_REF_NAME}-ios-b${IOS_BUILD}-unsigned.zip"

      - name: Upload packaged iOS asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package-android-web
      - package-ios
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          generate_release_notes: true
