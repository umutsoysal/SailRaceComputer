version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dart"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # One PR for the routine churn; anything that breaks the app surfaces as
      # its own reviewable PR.
      dart-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      firebase:
        patterns:
          - "firebase_*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "deps(android)"
    ignore:
      # The Android toolchain majors are pinned to what Flutter 3.41.1 actually
      # supports. Both of these were merged once and left main unable to build:
      #
      #   AGP 9.x    - drops the `kotlin-android` plugin, requires Gradle 9.5+,
      #                and makes Flutter's own Gradle plugin throw an NPE while
      #                applying.
      #   Gradle 9.x - AGP 8.11.1 cannot create its problem-reporter service on
      #                it, so the build fails during configuration.
      #
      # Revisit both together when the pinned Flutter version supports AGP 9;
      # until then a major bump here only produces a red build.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # No `bundler` entry for /ios: there is no Gemfile there, so every run failed
  # with "No files found in /ios". iOS dependencies come from CocoaPods
  # (ios/Podfile), which Dependabot does not support — Pods are refreshed by
  # `pod update` during an iOS release. Re-add bundler here only if a Gemfile
  # is introduced, e.g. for fastlane.
