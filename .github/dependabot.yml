version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dart"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # One PR for the routine churn; anything that breaks the app surfaces as
      # its own reviewable PR.
      dart-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      firebase:
        patterns:
          - "firebase_*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "deps(android)"
    ignore:
      # AGP 9 requires Gradle 9.5+ and drops the `kotlin-android` plugin, and
      # Flutter 3.41.1's own Gradle plugin throws an NPE under it. Revisit when
      # the pinned Flutter version supports AGP 9; until then a major bump here
      # only produces a red build.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ios"
    commit-message:
      prefix: "deps(ios)"
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
